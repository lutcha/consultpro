name: consultpro
region: fra

domains:
- domain: consultpro.cv
  type: PRIMARY
- domain: www.consultpro.cv
  type: ALIAS

# ── Ingress routing ──────────────────────────────────────────
ingress:
  rules:
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /admin
  - component:
      name: api
      preserve_path_prefix: true
    match:
      path:
        prefix: /static
  - component:
      name: frontend
    match:
      path:
        prefix: /

# ── Frontend (Static Site) ────────────────────────────────────
static_sites:
- name: frontend
  github:
    repo: lutcha/consultpro
    branch: main
    deploy_on_push: true
  source_dir: frontend
  build_command: npm ci && npm run build
  output_dir: dist
  index_document: index.html
  catchall_document: index.html
  envs:
  - key: VITE_APP_NAME
    value: ConsultPro
  - key: VITE_APP_VERSION
    value: "1.0.0"

# ── Backend API (Django) ──────────────────────────────────────
services:
- name: api
  github:
    repo: lutcha/consultpro
    branch: main
    deploy_on_push: true
  dockerfile_path: docker/Dockerfile
  http_port: 8000
  instance_size_slug: basic-xs
  instance_count: 1
  health_check:
    http_path: /health/
    initial_delay_seconds: 30
    period_seconds: 30
  envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
    scope: RUN_AND_BUILD_TIME
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DEBUG
    value: "False"
    scope: RUN_AND_BUILD_TIME
  - key: SECURE_SSL_REDIRECT
    value: "False"
    scope: RUN_AND_BUILD_TIME
  - key: ALLOWED_HOSTS
    value: "${APP_DOMAIN}"
    scope: RUN_AND_BUILD_TIME
  - key: CORS_ALLOWED_ORIGINS
    value: "https://${APP_DOMAIN}"
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_DB
    value: ${db.DATABASE}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_USER
    value: ${db.USERNAME}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_PASSWORD
    value: ${db.PASSWORD}
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: POSTGRES_HOST
    value: ${db.HOSTNAME}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_PORT
    value: ${db.PORT}
    scope: RUN_AND_BUILD_TIME
  - key: REDIS_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: CELERY_BROKER_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: CELERY_RESULT_BACKEND
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: JWT_ACCESS_TOKEN_LIFETIME
    value: "60"
    scope: RUN_AND_BUILD_TIME
  - key: JWT_REFRESH_TOKEN_LIFETIME
    value: "10080"
    scope: RUN_AND_BUILD_TIME
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: AI_PROVIDER
    scope: RUN_AND_BUILD_TIME
    value: deepseek
  - key: DEEPSEEK_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: KIMI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: ANTHROPIC_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: QWEN_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: GOOGLE_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: AWS_ACCESS_KEY_ID
    scope: RUN_AND_BUILD_TIME
    value: minioadmin
  - key: AWS_SECRET_ACCESS_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: AWS_STORAGE_BUCKET_NAME
    value: consultpro
    scope: RUN_AND_BUILD_TIME
  - key: AWS_S3_ENDPOINT_URL
    value: placeholder-set-via-dashboard
    scope: RUN_AND_BUILD_TIME
  - key: AWS_S3_REGION_NAME
    value: us-east-1
    scope: RUN_AND_BUILD_TIME

# ── Celery Worker ─────────────────────────────────────────────
workers:
- name: celery
  github:
    repo: lutcha/consultpro
    branch: main
    deploy_on_push: true
  dockerfile_path: docker/Dockerfile
  instance_size_slug: basic-xs
  instance_count: 1
  run_command: celery -A config worker --loglevel=info --concurrency=2
  envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
    scope: RUN_AND_BUILD_TIME
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: POSTGRES_DB
    value: ${db.DATABASE}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_USER
    value: ${db.USERNAME}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_PASSWORD
    value: ${db.PASSWORD}
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: POSTGRES_HOST
    value: ${db.HOSTNAME}
    scope: RUN_AND_BUILD_TIME
  - key: POSTGRES_PORT
    value: ${db.PORT}
    scope: RUN_AND_BUILD_TIME
  - key: REDIS_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: CELERY_BROKER_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: CELERY_RESULT_BACKEND
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}
  - key: AI_PROVIDER
    scope: RUN_AND_BUILD_TIME
    value: deepseek
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: DEEPSEEK_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: KIMI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: ANTHROPIC_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: QWEN_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard
  - key: GOOGLE_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
    value: placeholder-set-via-dashboard

# ── Jobs (migrations) ─────────────────────────────────────────
jobs:
- name: migrate
  github:
    repo: lutcha/consultpro
    branch: main
    deploy_on_push: true
  dockerfile_path: docker/Dockerfile
  run_command: python manage.py migrate --noinput
  kind: PRE_DEPLOY
  instance_size_slug: basic-xs
  envs:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
    scope: RUN_AND_BUILD_TIME
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: POSTGRES_DB
