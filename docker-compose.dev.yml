# Run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  flower:
    image: mher/flower:2.0.0
    command: celery --broker=redis://redis:6379/1 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery
    environment:
      - FLOWER_BASIC_AUTH=admin:${FLOWER_PASSWORD:-devpassword}

  pgadmin:
    image: dpage/pgadmin4:8
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-dev@consultpro.cv}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-devpassword}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgadmin_data:
